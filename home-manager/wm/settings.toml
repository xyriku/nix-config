[shell]
polkit_agent = true
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    pinned = [ "app.liten.Gram", "org.kde.dolphin", "com.moonlight_stream.Moonlight", "clipstudiopaint" ]

        [shell.launcher.dmenu.entry.fubu]
        command = "printf 'Open Youtube Link in MPV'"
        exec = "mpv '{query}'"
        freeform = true
        global = false
        gylph = "bell"
        label = "Fubu"
        prefix = "fubu"

    [shell.mpris]
    blacklist = [ "floorp" ]

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "glass"

    [shell.screenshot]
    annotate = true
    directory = "/home/minto/Pictures/Screenshots"
    show_cursor = true

