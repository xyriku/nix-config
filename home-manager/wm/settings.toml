max_keys = 8
overlay_open_near_click = true
overlay_position = "bottom_left"
timeout_ms = 2400

[plugin_settings."h-jangra/region-recorder"]
audio_source = "default_output"
copy_to_clipboard = true

[plugin_settings."noctalia/screen_recorder"]
replay_duration = 300
replay_enabled = true
replay_filename_pattern = "recording_%Y%m%d_%H%M%S"
restore_portal = true

[plugin_settings."noctalia/umbriel-companion"]
panel_placement = "floating"

[plugin_settings."raycursive/discord-voice"]
discord_binary = "/usr/bin/equibop"

[plugins]
auto_update = "official"
enabled = [
    "fel/ocr",
